# dsh-desktop bundle patch: insert the launcher row into the web plugin roster.
# Install with:
#   dsh plugin --profile web add <this-package-path-or-npm-name>
# The row injects the webRuntime service, so it activates only after the web
# server has bound and the runtime URL is resolvable.
- insert:
    - id: dsh-desktop
      name: '@deepseek-club/dsh-desktop'
      config:
        enabled: true
        delayMs: 500
        shortcut:
          enabled: true
          shortcutName: DSH Desktop
          icon: whale-black
          description: DSH Desktop — 一键启动 DeepSeek Harness
